<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>{% block titulo %}Sistema de Estoque{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Expanded:wght@700;800&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<button class="botao-menu" id="botao-menu-lateral" aria-label="Abrir menu">
  <span></span><span></span><span></span>
</button>

<div class="fundo-menu oculto" id="fundo-menu-lateral">
  <nav class="menu-lateral" id="menu-lateral">
    <div class="menu-lateral__cabecalho">
      <span class="menu-lateral__titulo">Menu</span>
      <button class="menu-lateral__fechar" id="botao-fechar-menu" aria-label="Fechar menu">&times;</button>
    </div>
    <ul class="menu-lateral__lista">
      <li>
        <button class="menu-lateral__item" disabled>
          Perfil <span class="menu-lateral__tag">em breve</span>
        </button>
      </li>
      <li>
        <button class="menu-lateral__item" disabled>
          Ajustes <span class="menu-lateral__tag">em breve</span>
        </button>
      </li>
      <li><a class="menu-lateral__item menu-lateral__item--link" href="/logs">Logs</a></li>
    </ul>
    <div class="menu-lateral__rodape">
      <a class="menu-lateral__item menu-lateral__item--link" href="/">Estoque</a>
      <a class="menu-lateral__item menu-lateral__item--link" href="/gerente">Painel da gerência</a>
    </div>
  </nav>
</div>

{% block conteudo %}{% endblock %}

<script src="/static/js/menu.js"></script>
</body>
</html>
